[project]
name = "tws-graph"
version = "0.1.0"
description = "TWS Code Graph — 预建代码符号关系图，agent 查图而非搜索"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.4",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
tws-graph = "tws_graph.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "--cov=tws_graph --cov-report=term --cov-report=html"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/tws_graph"]
omit = ["src/tws_graph/cli.py"]

[tool.coverage.report]
# fail_under raised incrementally as test coverage grows

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
