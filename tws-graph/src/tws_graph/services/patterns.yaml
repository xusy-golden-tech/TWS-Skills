# P10: Library pattern database for cross-service route detection
# Stores known framework patterns keyed by language.
#
# Each entry under a category:
#   pattern:   substring or regex pattern to match in source
#   kind:      decorator | annotation | function | method | class | constructor
#   frameworks: [list of framework names]
#   direction: (channels/grpc only) produce | consume | both | client | server
#
# Total entries: >150

languages:
  python:
    routes:
      - pattern: "@app.route"
        kind: decorator
        frameworks: [flask]
      - pattern: "@bp.route"
        kind: decorator
        frameworks: [flask]
      - pattern: "@router.get"
        kind: decorator
        frameworks: [fastapi]
      - pattern: "@router.post"
        kind: decorator
        frameworks: [fastapi]
      - pattern: "@router.put"
        kind: decorator
        frameworks: [fastapi]
      - pattern: "@router.delete"
        kind: decorator
        frameworks: [fastapi]
      - pattern: "@router.patch"
        kind: decorator
        frameworks: [fastapi]
      - pattern: "@router.head"
        kind: decorator
        frameworks: [fastapi]
      - pattern: "@router.options"
        kind: decorator
        frameworks: [fastapi]
      - pattern: "@app.get"
        kind: decorator
        frameworks: [fastapi]
      - pattern: "@app.post"
        kind: decorator
        frameworks: [fastapi]
      - pattern: "@app.put"
        kind: decorator
        frameworks: [fastapi]
      - pattern: "@app.delete"
        kind: decorator
        frameworks: [fastapi]
      - pattern: "@app.patch"
        kind: decorator
        frameworks: [fastapi]
      - pattern: "@app.head"
        kind: decorator
        frameworks: [fastapi]
      - pattern: "@app.options"
        kind: decorator
        frameworks: [fastapi]
      - pattern: "path("
        kind: function
        frameworks: [django]
      - pattern: "re_path("
        kind: function
        frameworks: [django]
      - pattern: "url("
        kind: function
        frameworks: [django]
      - pattern: "@action"
        kind: decorator
        frameworks: [django-rest-framework]
      - pattern: "add_url_rule"
        kind: method
        frameworks: [flask]
      - pattern: "Route("
        kind: class
        frameworks: [bottle]
      - pattern: "@app.websocket"
        kind: decorator
        frameworks: [fastapi]
      - pattern: "@router.websocket"
        kind: decorator
        frameworks: [fastapi]
      - pattern: "@app.websocket_route"
        kind: decorator
        frameworks: [sanic]
      - pattern: "@get("
        kind: decorator
        frameworks: [bottle]
      - pattern: "@post("
        kind: decorator
        frameworks: [bottle]
      - pattern: "@put("
        kind: decorator
        frameworks: [bottle]
      - pattern: "@delete("
        kind: decorator
        frameworks: [bottle]
      - pattern: "@route("
        kind: decorator
        frameworks: [bottle]
    channels:
      - pattern: "KafkaProducer"
        kind: class
        direction: produce
        frameworks: [kafka-python]
      - pattern: "KafkaConsumer"
        kind: class
        direction: consume
        frameworks: [kafka-python]
      - pattern: "@receiver"
        kind: decorator
        direction: consume
        frameworks: [django-signals]
      - pattern: "send_task"
        kind: method
        direction: produce
        frameworks: [celery]
      - pattern: "@task"
        kind: decorator
        direction: consume
        frameworks: [celery]
      - pattern: "@shared_task"
        kind: decorator
        direction: consume
        frameworks: [celery]
      - pattern: "queue.declare"
        kind: method
        direction: both
        frameworks: [pika]
      - pattern: "basic_publish"
        kind: method
        direction: produce
        frameworks: [pika]
      - pattern: "basic_consume"
        kind: method
        direction: consume
        frameworks: [pika]
      - pattern: "channel("
        kind: function
        direction: produce
        frameworks: [redis-py]
      - pattern: "pubsub("
        kind: method
        direction: consume
        frameworks: [redis-py]
      - pattern: "@app.task"
        kind: decorator
        direction: consume
        frameworks: [celery-flask]
      - pattern: "signals.post_save"
        kind: attribute
        direction: consume
        frameworks: [django-signals]
      - pattern: "signals.pre_save"
        kind: attribute
        direction: consume
        frameworks: [django-signals]
      - pattern: "signals.post_delete"
        kind: attribute
        direction: consume
        frameworks: [django-signals]
    grpc:
      - pattern: "grpc.server"
        kind: function
        frameworks: [grpc-python]
      - pattern: "grpc.insecure_channel"
        kind: function
        direction: client
        frameworks: [grpc-python]
      - pattern: ".Stub("
        kind: constructor
        direction: client
        frameworks: [grpc-python]
      - pattern: "add_MyServiceServicer_to_server"
        kind: function
        direction: server
        frameworks: [grpc-python]
      - pattern: "grpc.secure_channel"
        kind: function
        direction: client
        frameworks: [grpc-python]
      - pattern: "grpc.aio.insecure_channel"
        kind: function
        direction: client
        frameworks: [grpc-python]
      - pattern: "grpc.aio.secure_channel"
        kind: function
        direction: client
        frameworks: [grpc-python]

